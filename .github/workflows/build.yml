name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install "yt-dlp[default]==2026.6.9" "pyinstaller==6.16.0" "imageio-ffmpeg==0.6.0"
      - run: python scripts/package.py
        env:
          RIUM_ARCH: ${{ matrix.arch }}
      - run: python scripts/smoke.py
      - run: python scripts/setup.py
        env:
          RIUM_ARCH: ${{ matrix.arch }}
      - run: python scripts/setup_smoke.py
        env:
          RIUM_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Rium-Download-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
